name: Installation test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  install:
    name: Install (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS https://get.chezmoi.io/lb)" -- -b "${HOME}/.local/bin"
      - name: Test initial setup
        run: |
          bash .tests/test-bootstrap-cli.sh
          bash .tests/test-bootstrap-downloads.sh
          CHEZMOI_TEST_COMMAND="${HOME}/.local/bin/chezmoi" bash .tests/test-bootstrap-lifecycle.sh
      - name: Test package updates with a fresh PATH
        run: bash .tests/test-update-packages.sh
      - name: Apply checked-out dotfiles
        run: '"${HOME}/.local/bin/chezmoi" init --source "${GITHUB_WORKSPACE}" --apply'
      - name: Remove chezmoi binary
        run: rm -f "${HOME}/.local/bin/chezmoi"
      - name: Verify Nix packages and zsh plugins
        run: |
          source /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          export PATH="${HOME}/.nix-profile/bin:${PATH}"

          nix --version
          home-manager generations

          for command in chezmoi git eza jq op; do
            test -x "${HOME}/.nix-profile/bin/${command}"
          done
          git --version
          op --version

          zsh -f <<'EOF'
          set -e
          source "${HOME}/.config/zsh/plugins.zsh"
          (( $+functions[p10k] ))
          (( $+functions[_zsh_highlight] ))
          (( $+functions[_zsh_autosuggest_start] ))
          EOF
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set ExecutionPolicy
        run: Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
      - name: Install chezmoi
        run: iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b $HOME/.local/bin"
      - name: Apply checked-out dotfiles
        run: '& "$HOME/.local/bin/chezmoi.exe" init --source "$env:GITHUB_WORKSPACE" --apply'
      - name: Remove chezmoi binary
        run: rm $HOME/.local/bin/chezmoi.exe -Force
