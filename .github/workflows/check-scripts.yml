name: Check scripts
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install ShellCheck with aqua
        uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2
          aqua_opts: ""
      - name: Check initial setup scripts
        run: aqua exec -- shellcheck -x scripts/bootstrap-cli.sh scripts/bootstrap-op.sh scripts/test-bootstrap-*.sh scripts/test-update-packages.sh home/dot_local/bin/executable_gh-ext
      - name: Run ShellCheck
        run: find home/.chezmoiscripts -type f -name '*.sh' ! -path '*/windows/*' -print0 | xargs -0 -r aqua exec -- shellcheck
  PSSrcriptAnalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test WSL installation detection
        shell: pwsh
        run: ./scripts/test-install-wsl.ps1
      - name: Test GitHub CLI extension management (PowerShell)
        shell: pwsh
        run: ./scripts/test-gh-ext.ps1
      - name: Test GitHub CLI extension management (Windows PowerShell)
        shell: powershell
        run: ./scripts/test-gh-ext.ps1
      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: home/.chezmoiscripts/windows
          recurse: true
          output: results.sarif
