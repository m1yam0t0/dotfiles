name: Check scripts
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check initial setup scripts
        run: shellcheck -x scripts/bootstrap-cli.sh scripts/bootstrap-op.sh scripts/test-bootstrap-*.sh scripts/test-update-packages.sh home/dot_local/bin/executable_gh-ext
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: home/.chezmoiscripts
          ignore_paths: home/.chezmoiscripts/windows
  PSSrcriptAnalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test WSL installation detection
        shell: pwsh
        run: ./scripts/test-install-wsl.ps1
      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: home/.chezmoiscripts/windows
          recurse: true
          output: results.sarif
